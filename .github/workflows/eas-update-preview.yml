# Publishes an EAS Update for each PR so you can open the same dev/preview build
# on a device and load this revision (QR + link are posted on the PR).
# Requires repository secret EXPO_TOKEN (https://expo.dev/settings/access-tokens).

name: EAS Update preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: eas-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Publish EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish update and comment on PR
        uses: expo/expo-github-action/preview@v8
        with:
          command: >-
            eas update
            --auto
            --non-interactive
            --branch pr-${{ github.event.pull_request.number }}
            --message "PR #${{ github.event.pull_request.number }}"
